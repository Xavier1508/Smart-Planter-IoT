; Tunas Smart Planter - local-only firmware (ESP32 / NodeMCU-32S).
; The device runs its own WPA2 AP "Moss" and streams JSON on 192.168.4.1:3333.
; No cloud build flags, router credentials, or TLS are used.

[platformio]
default_envs = nodemcu-32s

[env:nodemcu-32s]
; Keep both relay loads disconnected until the wiring is verified.
platform = espressif32@6.12.0
board = nodemcu-32s
framework = arduino

monitor_speed = 115200
lib_deps =
	marcoschwartz/LiquidCrystal_I2C@1.1.4
	adafruit/DHT sensor library@1.4.7
	adafruit/Adafruit Unified Sensor@1.1.15
	bblanchon/ArduinoJson@7.4.2

; Software safety defaults. They can be overridden for host tests, but the
; production firmware must keep the multi-sample confirmations.
build_flags =
    -DMOSS_PUMP_DRY_CONFIRM_SAMPLES=5
    -DMOSS_LIGHT_CONFIRM_SAMPLES=3
