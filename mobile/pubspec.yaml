name: smart_planter
description: "Dashboard Android Tunas untuk smart planter, karakter 3D, dan prediksi demo."
publish_to: 'none'
version: 0.6.0+21

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: 0.24.3
  supabase_flutter: 2.18.3
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  default-flavor: production
  uses-material-design: true
  assets:
    - assets/ml/plant-health.json
